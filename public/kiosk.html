<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Plane-Zone Kiosk</title>
  <style>
    :root{
      --bg:#0b1220;
      --panel: rgba(255,255,255,.05);
      --border: rgba(255,255,255,.10);
      --text:#e7eefc;
      --muted:#9fb0cf;
      --accent:#38bdf8;
      --accent2:#22c55e;
      --shadow: 0 14px 30px rgba(0,0,0,.38);
      --r: 18px;
      --btn: rgba(255,255,255,.08);
    }
    *{ box-sizing:border-box; }
    html,body{ height:100%; }
    body{
      margin:0;
      background:
        radial-gradient(900px 520px at 50% -120px, rgba(56,189,248,.22), transparent 55%),
        radial-gradient(700px 420px at 15% 20%, rgba(34,197,94,.12), transparent 60%),
        var(--bg);
      color:var(--text);
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      overflow:hidden;
    }
    .wrap{
      height:100%;
      padding: 12px;
      display:flex;
      flex-direction:column;
      gap:10px;
    }

    /* screens */
    .screen{
      display:none;
      height:100%;
      flex-direction:column;
      gap:10px;
      animation: fadeIn .25s ease-out;
    }
    .screen.active{ display:flex; }
    @keyframes fadeIn{
      from{ opacity:0; transform: translateY(6px); }
      to{ opacity:1; transform: translateY(0); }
    }

    /* header */
    .top{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
    }
    .brand{
      display:flex;
      align-items:center;
      gap:10px;
      font-weight:900;
      letter-spacing:.2px;
    }
    .brand .emoji{ font-size:18px; }
    .brand .t{ font-size:14px; color:var(--muted); font-weight:800; }
    .net{
      display:flex; align-items:center; gap:8px;
      padding:6px 10px;
      border-radius:999px;
      border:1px solid var(--border);
      background: rgba(255,255,255,.03);
      font-size:12px;
      color:var(--muted);
      font-weight:800;
    }
    .dot{ width:8px; height:8px; border-radius:99px; background:#f59e0b; box-shadow:0 0 12px rgba(245,158,11,.55); }
    .dot.ok{ background: var(--accent2); box-shadow:0 0 12px rgba(34,197,94,.55); }
    .dot.bad{ background: #ef4444; box-shadow:0 0 12px rgba(239,68,68,.55); }

    /* cards */
    .card{
      border:1px solid var(--border);
      background: linear-gradient(180deg, rgba(255,255,255,.07), rgba(255,255,255,.03));
      border-radius: var(--r);
      box-shadow: var(--shadow);
      padding: 12px;
    }

    /* clock screen */
    .clockBox{
      flex:1;
      display:flex;
      flex-direction:column;
      justify-content:center;
      align-items:center;
      text-align:center;
      gap:8px;
    }
    .time{
      font-size:72px;
      font-weight:1000;
      line-height:1;
      letter-spacing:1px;
    }
    .seconds{
      font-size:14px;
      color:var(--muted);
      font-weight:900;
      letter-spacing:.3px;
    }
    .date{
      margin-top:6px;
      font-size:16px;
      color:var(--text);
      font-weight:900;
      opacity:.95;
      text-transform: capitalize;
    }
    .subdate{
      font-size:12px;
      color:var(--muted);
      font-weight:800;
      margin-top:2px;
    }

    /* buttons */
    .btnRow{ display:flex; gap:10px; }
    .btn{
      flex:1;
      border:1px solid var(--border);
      background: var(--btn);
      color: var(--text);
      font-weight:900;
      border-radius: 14px;
      padding: 14px 12px;
      font-size:14px;
      letter-spacing:.2px;
      cursor:pointer;
      user-select:none;
      -webkit-tap-highlight-color: transparent;
    }
    .btn.primary{
      background: linear-gradient(180deg, rgba(56,189,248,.22), rgba(56,189,248,.12));
      border-color: rgba(56,189,248,.35);
    }
    .btn:active{ transform: translateY(1px); }

    /* flight screen (compact) */
    .headline{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:10px;
      margin-bottom:10px;
    }
    .callsign{
      font-size:26px;
      font-weight:1000;
      letter-spacing:.4px;
      line-height:1.05;
    }
    .sub{
      margin-top:6px;
      font-size:12px;
      color:var(--muted);
      font-weight:900;
      line-height:1.2;
    }
    .logo{
      width:38px; height:38px;
      object-fit:contain;
      background:#fff;
      border-radius:12px;
      padding:6px;
      box-shadow: 0 2px 3px rgba(0,0,0,.12), 0 10px 20px rgba(0,0,0,.22);
      border:1px solid rgba(0,0,0,.06);
      display:none;
    }

    .route{
      display:grid;
      grid-template-columns: 1fr 18px 1fr;
      gap:8px;
      align-items:center;
      padding: 10px;
      border-radius: 16px;
      background: rgba(255,255,255,.03);
      border:1px solid var(--border);
      margin-bottom:10px;
    }
    .label{ font-size:11px; color:var(--muted); font-weight:900; text-transform:uppercase; letter-spacing:.3px; margin-bottom:4px;}
    .val{ font-size:13px; font-weight:1000; line-height:1.15; word-break:break-word;}
    .arrow{ text-align:center; color: var(--accent); font-weight:1000; font-size:16px; }

    .modelBox{
      border-radius: 16px;
      background: rgba(255,255,255,.03);
      border:1px solid var(--border);
      padding: 12px;
      text-align:center;
    }
    .modelBox .k{
      font-size:11px; color:var(--muted); font-weight:900; text-transform:uppercase; letter-spacing:.3px;
    }
    .modelBox .v{
      margin-top:6px;
      font-size:18px;
      font-weight:1000;
      letter-spacing:.2px;
      line-height:1.1;
    }

    .err{
      color:#fecaca;
      font-size:12px;
      font-weight:900;
      margin-top:8px;
      min-height:14px;
    }

    /* animation when plane changes */
    .pulse{
      animation: pulseIn .50s ease-out;
    }
    @keyframes pulseIn{
      from{ transform: translateY(6px); opacity: .0; }
      to{ transform: translateY(0); opacity: 1; }
    }
  </style>
</head>

<body>
  <div class="wrap">

    <!-- CLOCK SCREEN -->
    <section id="screenClock" class="screen active">
      <div class="top">
        <div class="brand"><span class="emoji">✈️</span><span class="t">Plane-Zone</span></div>
        <div class="net"><span id="dot" class="dot"></span><span id="netTxt">NET</span></div>
      </div>

      <div class="card clockBox">
        <div class="time" id="time">--:--</div>
        <div class="seconds" id="seconds">--</div>
        <div class="date" id="datePretty">—</div>
        <div class="subdate" id="dateSmall">—</div>
      </div>

      <div class="btnRow">
        <button class="btn primary" id="btnShow">Mostra aereo</button>
      </div>
    </section>

    <!-- FLIGHT SCREEN -->
    <section id="screenFlight" class="screen">
      <div class="top">
        <div class="brand"><span class="emoji">🛫</span><span class="t">Dettagli volo</span></div>
        <div class="net"><span id="dot2" class="dot"></span><span id="netTxt2">NET</span></div>
      </div>

      <div class="card" id="flightCard">
        <div class="headline">
          <div style="min-width:0">
            <div class="callsign" id="callsign">—</div>
            <div class="sub">
              callsign_iata: <span id="callsign_iata">—</span><br>
              airline: <span id="airline_name">—</span>
            </div>
          </div>
          <img id="logo" class="logo" alt="logo" />
        </div>

        <div class="route">
          <div>
            <div class="label">Da</div>
            <div class="val" id="fromTxt">—</div>
          </div>
          <div class="arrow">➜</div>
          <div style="text-align:right">
            <div class="label">A</div>
            <div class="val" id="toTxt">—</div>
          </div>
        </div>

        <div class="modelBox">
          <div class="k">Modello aereo</div>
          <div class="v" id="model">—</div>
        </div>

        <div class="err" id="err"></div>
      </div>

      <div class="btnRow">
        <button class="btn" id="btnBack">Back</button>
        <button class="btn primary" id="btnRefresh">Aggiorna</button>
      </div>
    </section>

  </div>

<script>
  function iataFromCallsignIata(csIata){
    if(!csIata || typeof csIata !== "string") return null;
    const code = csIata.trim().slice(0,2).toUpperCase();
    return /^[A-Z0-9]{2}$/.test(code) ? code : null;
  }
  function airhexLogoUrl(iata){
    return `https://content.airhex.com/content/logos/airlines_${iata}_200_200_r.png`;
  }
  function fmtAirport(x){
    if(!x) return "N/D";
    const m = x.municipality || "—";
    const n = x.name || "—";
    return `${m} — ${n}`;
  }

  function setNet(ok, msg){
    const dot = document.getElementById("dot");
    const dot2 = document.getElementById("dot2");
    const t1 = document.getElementById("netTxt");
    const t2 = document.getElementById("netTxt2");
    [dot,dot2].forEach(d => d.classList.remove("ok","bad"));
    if(ok === true){
      [dot,dot2].forEach(d => d.classList.add("ok"));
      t1.textContent = msg || "OK"; t2.textContent = msg || "OK";
    } else if(ok === false){
      [dot,dot2].forEach(d => d.classList.add("bad"));
      t1.textContent = msg || "ERR"; t2.textContent = msg || "ERR";
    } else {
      t1.textContent = msg || "NET"; t2.textContent = msg || "NET";
    }
  }

  // screens
  const screenClock = document.getElementById("screenClock");
  const screenFlight = document.getElementById("screenFlight");
  const flightCard = document.getElementById("flightCard");

  function showClock(){
    screenFlight.classList.remove("active");
    screenClock.classList.add("active");
  }
  function showFlight(){
    screenClock.classList.remove("active");
    screenFlight.classList.add("active");
  }

  document.getElementById("btnShow").addEventListener("click", async () => {
    showFlight();
    await fetchPlanes(true);
  });
  document.getElementById("btnBack").addEventListener("click", () => showClock());
  document.getElementById("btnRefresh").addEventListener("click", () => fetchPlanes(true));

  // clock
  function tickClock(){
    const d = new Date();
    const hh = String(d.getHours()).padStart(2,"0");
    const mm = String(d.getMinutes()).padStart(2,"0");
    const ss = String(d.getSeconds()).padStart(2,"0");
    document.getElementById("time").textContent = `${hh}:${mm}`;
    document.getElementById("seconds").textContent = `${ss} sec`;
    document.getElementById("datePretty").textContent =
      d.toLocaleDateString("it-IT", { weekday:"long", day:"2-digit", month:"long" });
    document.getElementById("dateSmall").textContent =
      d.toLocaleDateString("it-IT", { year:"numeric" });
  }
  tickClock();
  setInterval(tickClock, 1000);

  // pick plane
  function pickFeatured(planes){
    if(!planes || !planes.length) return null;
    const withRoute = planes.filter(p => p.from && p.to && p.airline_name);
    return withRoute[0] || planes[0];
  }

  let lastKey = null;

  function updateUI(p){
    const err = document.getElementById("err");
    err.textContent = "";

    if(!p){
      document.getElementById("callsign").textContent = "Nessun aereo trovato";
      document.getElementById("callsign_iata").textContent = "—";
      document.getElementById("airline_name").textContent = "—";
      document.getElementById("fromTxt").textContent = "—";
      document.getElementById("toTxt").textContent = "—";
      document.getElementById("model").textContent = "—";
      document.getElementById("logo").style.display = "none";
      return;
    }

    const key = `${p.icao24||""}|${p.callsign||""}|${p.callsign_iata||""}|${p.airline_name||""}|${p.from?.name||""}|${p.to?.name||""}|${p.aircraft_model||""}`;
    if(key !== lastKey){
      flightCard.classList.remove("pulse");
      void flightCard.offsetWidth;
      flightCard.classList.add("pulse");
      lastKey = key;
    }

    document.getElementById("callsign").textContent = p.callsign || "—";
    document.getElementById("callsign_iata").textContent = p.callsign_iata || "—";
    document.getElementById("airline_name").textContent = p.airline_name || "—";
    document.getElementById("fromTxt").textContent = fmtAirport(p.from);
    document.getElementById("toTxt").textContent = fmtAirport(p.to);
    document.getElementById("model").textContent = p.aircraft_model || "—";

    const iata = iataFromCallsignIata(p.callsign_iata);
    const logo = document.getElementById("logo");
    if(iata){
      logo.src = airhexLogoUrl(iata);
      logo.style.display = "";
      logo.onerror = () => { logo.style.display="none"; };
    } else {
      logo.style.display="none";
    }
  }

  async function fetchPlanes(){
    const err = document.getElementById("err");
    try{
      setNet(null,"NET");
      const r = await fetch("/api/planes", { cache:"no-store" });
      if(!r.ok) throw new Error(`HTTP ${r.status}`);
      const planes = await r.json();
      setNet(true,"OK");
      updateUI(pickFeatured(planes));
    }catch(e){
      setNet(false,"ERR");
      err.textContent = String(e.message || e);
      updateUI(null);
    }
  }

  // auto-refresh: solo mentre sei in Flight, ogni 60s
  setInterval(() => {
    if(screenFlight.classList.contains("active")) fetchPlanes();
  }, 60 * 1000);
</script>
</body>
</html>
