<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Plane-Zone Kiosk</title>
  <style>
    :root{
      --bg:#0b1220;
      --border: rgba(255,255,255,.10);
      --text:#e7eefc;
      --muted:#9fb0cf;
      --accent:#38bdf8;
      --shadow: 0 14px 30px rgba(0,0,0,.38);
      --r: 18px;
      --btn: rgba(255,255,255,.08);
    }
    *{ box-sizing:border-box; }
    html,body{ height:100%; }
    body{
      margin:0;
      background:
        radial-gradient(900px 520px at 50% -120px, rgba(56,189,248,.22), transparent 55%),
        radial-gradient(700px 420px at 15% 20%, rgba(34,197,94,.12), transparent 60%),
        var(--bg);
      color:var(--text);
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      overflow:hidden;
    }
    .wrap{
      height:100%;
      padding: 12px;
      display:flex;
      flex-direction:column;
      gap:10px;
    }

    .screen{
      display:none;
      height:100%;
      flex-direction:column;
      gap:10px;
      animation: fadeIn .25s ease-out;
    }
    .screen.active{ display:flex; }
    @keyframes fadeIn{
      from{ opacity:0; transform: translateY(6px); }
      to{ opacity:1; transform: translateY(0); }
    }

    .card{
      border:1px solid var(--border);
      background: linear-gradient(180deg, rgba(255,255,255,.07), rgba(255,255,255,.03));
      border-radius: var(--r);
      box-shadow: var(--shadow);
      padding: 12px;
    }

    /* CLOCK */
    .clockBox{
      flex:1;
      display:flex;
      flex-direction:column;
      justify-content:center;
      align-items:center;
      text-align:center;
      gap:8px;
    }
    .time{
      font-size:72px;
      font-weight:1000;
      line-height:1;
      letter-spacing:1px;
    }
    .seconds{
      font-size:14px;
      color:var(--muted);
      font-weight:900;
      letter-spacing:.3px;
    }
    .date{
      margin-top:6px;
      font-size:16px;
      font-weight:900;
      opacity:.95;
      text-transform: capitalize;
    }
    .subdate{
      font-size:12px;
      color:var(--muted);
      font-weight:800;
      margin-top:2px;
    }

    /* BUTTONS */
    .btnRow{ display:flex; gap:10px; }
    .btn{
      flex:1;
      border:1px solid var(--border);
      background: var(--btn);
      color: var(--text);
      font-weight:900;
      border-radius: 14px;
      padding: 14px 12px;
      font-size:14px;
      letter-spacing:.2px;
      cursor:pointer;
      user-select:none;
      -webkit-tap-highlight-color: transparent;
    }
    .btn.primary{
      background: linear-gradient(180deg, rgba(56,189,248,.22), rgba(56,189,248,.12));
      border-color: rgba(56,189,248,.35);
    }
    .btn:active{ transform: translateY(1px); }

    /* FLIGHT (compact) */
    .headline{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:10px;
      margin-bottom:10px;
    }
    .leftHead{ min-width:0; }
    .callsign{
      font-size:26px;
      font-weight:1000;
      letter-spacing:.4px;
      line-height:1.05;
    }
    .sub{
      margin-top:6px;
      font-size:12px;
      color:var(--muted);
      font-weight:900;
      line-height:1.2;
    }
    .modelRight{
      font-size:18px;
      font-weight:1000;
      letter-spacing:.4px;
      color:var(--accent);
      margin-left:auto;
      padding-left:8px;
      white-space:nowrap;
    }

    .logo{
      width:36px; height:36px;
      object-fit:contain;
      background:#fff;
      border-radius:12px;
      padding:6px;
      box-shadow: 0 2px 3px rgba(0,0,0,.12), 0 10px 20px rgba(0,0,0,.22);
      border:1px solid rgba(0,0,0,.06);
      display:none;
    }

    .route{
      display:grid;
      grid-template-columns: 1fr 18px 1fr;
      gap:8px;
      align-items:center;
      padding: 10px;
      border-radius: 16px;
      background: rgba(255,255,255,.03);
      border:1px solid var(--border);
      margin-bottom:10px;
    }
    .label{ font-size:11px; color:var(--muted); font-weight:900; text-transform:uppercase; letter-spacing:.3px; margin-bottom:4px;}
    .val{ font-size:13px; font-weight:1000; line-height:1.15; word-break:break-word;}
    .arrow{ text-align:center; color: var(--accent); font-weight:1000; font-size:16px; }

    .err{
      color:#fecaca;
      font-size:12px;
      font-weight:900;
      margin-top:8px;
      min-height:14px;
    }

    .pulse{ animation: pulseIn .45s ease-out; }
    @keyframes pulseIn{
      from{ transform: translateY(6px); opacity: .0; }
      to{ transform: translateY(0); opacity: 1; }
    }
  </style>
</head>

<body>
  <div class="wrap">

    <!-- SCREEN 1: CLOCK -->
    <section id="screenClock" class="screen active">
      <div class="card clockBox">
        <div class="time" id="time">--:--</div>
        <div class="seconds" id="seconds">--</div>
        <div class="date" id="datePretty">—</div>
        <div class="subdate" id="dateSmall">—</div>
      </div>

      <div class="btnRow">
        <button class="btn primary" id="btnShow">Mostra aereo</button>
      </div>
    </section>

    <!-- SCREEN 2: FLIGHT -->
    <section id="screenFlight" class="screen">
      <div class="card" id="flightCard">
        <div class="headline">
          <div class="leftHead">
            <div class="callsign" id="callsign">—</div>
            <div class="sub">
              callsign_icao: <span id="callsign_iata">—</span><br>
              airline: <span id="airline_name">—</span>
            </div>
          </div>

          <div style="display:flex; gap:8px; align-items:flex-start">
            <div class="modelRight" id="modelRight">—</div>
            <img id="logo" class="logo" alt="logo" />
          </div>
        </div>

        <div class="route">
          <div>
            <div class="label">Da</div>
            <div class="val" id="fromTxt">—</div>
          </div>
          <div class="arrow">➜</div>
          <div style="text-align:right">
            <div class="label">A</div>
            <div class="val" id="toTxt">—</div>
          </div>
        </div>

        <div class="err" id="err"></div>
      </div>

      <div class="btnRow">
        <button class="btn" id="btnBack">Back</button>
        <button class="btn primary" id="btnRefresh">Aggiorna</button>
      </div>
    </section>

  </div>

<script>
  function iataFromCallsignIata(csIata){
    if(!csIata || typeof csIata !== "string") return null;
    const code = csIata.trim().slice(0,2).toUpperCase();
    return /^[A-Z0-9]{2}$/.test(code) ? code : null;
  }
  function airhexLogoUrl(iata){
    return `https://content.airhex.com/content/logos/airlines_${iata}_200_200_r.png`;
  }
  function fmtAirport(x){
    if(!x) return "N/D";
    const m = x.municipality || "—";
    const n = x.name || "—";
    const i = x.iata || x.iata_code || x.iataCode || "";
    return i ? `${m} — ${n} (${i})` : `${m} — ${n}`;
  }

  const screenClock = document.getElementById("screenClock");
  const screenFlight = document.getElementById("screenFlight");
  const flightCard = document.getElementById("flightCard");

  function showClock(){
    screenFlight.classList.remove("active");
    screenClock.classList.add("active");
  }
  function showFlight(){
    screenClock.classList.remove("active");
    screenFlight.classList.add("active");
  }

  document.getElementById("btnShow").addEventListener("click", async () => {
    showFlight();
    await fetchPlanes();
  });
  document.getElementById("btnBack").addEventListener("click", () => showClock());
  document.getElementById("btnRefresh").addEventListener("click", () => fetchPlanes());

  function tickClock(){
    const d = new Date();
    const hh = String(d.getHours()).padStart(2,"0");
    const mm = String(d.getMinutes()).padStart(2,"0");
    const ss = String(d.getSeconds()).padStart(2,"0");
    document.getElementById("time").textContent = `${hh}:${mm}`;
    document.getElementById("seconds").textContent = `${ss} sec`;
    document.getElementById("datePretty").textContent =
      d.toLocaleDateString("it-IT", { weekday:"long", day:"2-digit", month:"long" });
    document.getElementById("dateSmall").textContent =
      d.toLocaleDateString("it-IT", { year:"numeric" });
  }
  tickClock();
  setInterval(tickClock, 1000);

  function pickFeatured(planes){
    if(!planes || !planes.length) return null;
    const withRoute = planes.filter(p => p.from && p.to && p.airline_name);
    return withRoute[0] || planes[0];
  }

  let lastKey = null;

  function updateUI(p){
    const err = document.getElementById("err");
    err.textContent = "";

    const logo = document.getElementById("logo");

    if(!p){
      document.getElementById("callsign").textContent = "Nessun aereo trovato";
      document.getElementById("callsign_iata").textContent = "—";
      document.getElementById("airline_name").textContent = "—";
      document.getElementById("fromTxt").textContent = "—";
      document.getElementById("toTxt").textContent = "—";
      document.getElementById("modelRight").textContent = "—";
      logo.style.display = "none";
      return;
    }

    const key = `${p.icao24||""}|${p.callsign||""}|${p.callsign_iata||""}|${p.airline_name||""}|${p.from?.name||""}|${p.to?.name||""}|${p.aircraft_model||""}`;
    if(key !== lastKey){
      flightCard.classList.remove("pulse");
      void flightCard.offsetWidth;
      flightCard.classList.add("pulse");
      lastKey = key;
    }

    document.getElementById("callsign").textContent = (p.callsign_iata || p.callsign || "—");
    document.getElementById("callsign_iata").textContent = (p.callsign || "—");
    document.getElementById("airline_name").textContent = p.airline_name || "—";
    document.getElementById("fromTxt").textContent = fmtAirport(p.from);
    document.getElementById("toTxt").textContent = fmtAirport(p.to);

    const model = p.aircraft_model || "—";
    document.getElementById("modelRight").textContent = model;

    const iata = iataFromCallsignIata(p.callsign_iata);
    if(iata){
      logo.src = airhexLogoUrl(iata);
      logo.style.display = "";
      logo.onerror = () => { logo.style.display="none"; };
    } else {
      logo.style.display="none";
    }
  }

  async function fetchPlanes(){
    const err = document.getElementById("err");
    try{
      const r = await fetch("/api/planes", { cache:"no-store" });
      if(!r.ok) throw new Error(`HTTP ${r.status}`);
      const planes = await r.json();
      updateUI(pickFeatured(planes));
    }catch(e){
      err.textContent = String(e.message || e);
      updateUI(null);
    }
  }

  // auto-refresh solo in Flight, ogni 60s
  setInterval(() => {
    if(screenFlight.classList.contains("active")) fetchPlanes();
  }, 60 * 1000);
</script>
</body>
</html>
