<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <title>Aerei nella zona</title>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; padding: 20px; }
    button { padding: 8px 14px; margin: 10px 0 18px; cursor: pointer; }
    .plane { border-bottom: 1px solid #e5e5e5; padding: 16px 0; }
    .row { display: flex; align-items: center; gap: 10px; }
    .logo {
      width: 40px; height: 40px; object-fit: contain;
      background: #fff; border-radius: 10px; padding: 6px;
      box-shadow: 0 1px 2px rgba(0,0,0,0.10), 0 4px 10px rgba(0,0,0,0.08);
      border: 1px solid rgba(0,0,0,0.05);
    }
    .cs { font-weight: 800; font-size: 22px; }
    .muted { color:#666; margin-top: 2px; }
    .photo {
      margin-top: 10px;
      max-width: 520px;
      width: 100%;
      border-radius: 14px;
      border: 1px solid rgba(0,0,0,0.06);
      box-shadow: 0 10px 26px rgba(0,0,0,0.12);
      display: block;
    }
  </style>
</head>
<body>
  <h1>✈️ Aerei nella zona</h1>
  <button onclick="load()">Aggiorna</button>
  <div id="list">—</div>

<script>
function fmtAirport(x){
  if(!x) return "N/D";
  return `${x.municipality || "—"} - ${x.name || "—"}`;
}
function iataFromCallsignIata(csIata){
  if(!csIata || typeof csIata !== "string") return null;
  const code = csIata.trim().slice(0,2).toUpperCase();
  return /^[A-Z0-9]{2}$/.test(code) ? code : null;
}
function airhexLogoUrl(iata){
  return `https://content.airhex.com/content/logos/airlines_${iata}_200_200_r.png`;
}

async function load() {
  const list = document.getElementById("list");
  list.textContent = "Caricamento...";

  const r = await fetch("/api/planes");
  const planes = await r.json();

  list.innerHTML = "";
  if (!planes.length) { list.textContent = "Nessun aereo trovato"; return; }

  for (const p of planes) {
    const iata = iataFromCallsignIata(p.callsign_iata);
    const logo = iata ? airhexLogoUrl(iata) : null;

    const modelText = p.aircraft_model || p.aircraft_type || "Modello N/D";
    const photo = p.aircraft_photo || null;

    const div = document.createElement("div");
    div.className = "plane";
    div.innerHTML = `
      <div class="row">
        ${logo ? `<img class="logo" src="${logo}" alt="${iata} logo" onerror="this.remove()">` : ""}
        <div class="cs">${p.callsign || "—"}</div>
      </div>

      <div class="muted">
        callsign_iata: <strong>${p.callsign_iata || "—"}</strong> — airline: <strong>${p.airline_name || "—"}</strong>
      </div>

      <div class="muted">✈ <strong>${modelText}</strong></div>

      ${photo ? `<img class="photo" src="${photo}" alt="${modelText}" onerror="this.remove()">` : ""}

      <div style="margin-top:10px;"><strong>Da:</strong> ${fmtAirport(p.from)}</div>
      <div><strong>A:</strong> ${fmtAirport(p.to)}</div>
    `;
    list.appendChild(div);
  }
}
</script>
</body>
</html>
